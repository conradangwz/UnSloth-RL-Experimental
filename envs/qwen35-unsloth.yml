name: qwen35_unsloth

channels:
  - conda-forge

# Clean Qwen3.5 GRPO environment.
# Create from scratch with:
#   conda env remove -n qwen35_unsloth -y
#   conda env create -f envs/qwen35-unsloth.yml
#   conda activate qwen35_unsloth
#
# This file keeps the stack intentionally narrow to avoid conda solver drift.
# PyTorch is installed from the official CUDA 12.1 wheel index so the env
# consistently gets a CUDA-enabled build on this machine.

dependencies:
  - python=3.12
  - pip
  - pip:
      # CUDA-enabled PyTorch stack for the dual RTX 3090 machine.
      - --extra-index-url https://download.pytorch.org/whl/cu121
      - torch==2.5.1+cu121
      - torchvision==0.20.1+cu121
      - torchaudio==2.5.1+cu121

      # Qwen3.5-compatible Unsloth stack.
      - unsloth
      - unsloth_zoo
      # torchao 0.17+ expects torch.int1 and breaks on the pinned Torch 2.5.1
      # build used by this environment. Keep torchao on the 0.16 line.
      - torchao==0.16.0
      - "transformers>=5.2.0,<=5.5.0"
      # Qwen3.5's linear-attention fast path needs these packages.
      # flash-linear-attention can be installed during env creation.
      # causal-conv1d is installed separately after env creation with
      # `pip install --no-build-isolation` so it uses the env's Torch/CUDA.
      - flash-linear-attention
      # Do not install torchao in this env. Some Transformers 5.x builds will
      # discover it automatically if present, and this repo does not need it.

      # GRPO / PEFT / distributed training.
      - trl
      - peft
      - accelerate
      - bitsandbytes

      # Dataset / logging / dashboard generation.
      - datasets
      - pandas
      - plotly

      # Utility / serialization dependencies used by the training and dashboard scripts.
      - numpy
      - scipy
      - scikit-learn
      - tqdm
      - sentencepiece
      - protobuf
      - safetensors
      - pillow
